name: Refresh repository dashboard

on:
  schedule:
    - cron: "15 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repository-dashboard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    name: Generate and publish repository documentation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate dashboard documentation
        run: python dashboard/dashboard.py

      - name: Commit generated changes when needed
        shell: bash
        run: |
          git add -- README.md dashboard/data.json
          if git diff --cached --quiet; then
            echo "Generated documentation is unchanged; no commit is needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: refresh generated repository dashboard"
          git push
